
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>FoxSkyLab & Fuxine</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }

    video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: black;
    }
  </style>
</head>

<body>

  <video
    id="animation"
    autoplay
    muted
    loop
    playsinline
    webkit-playsinline
    preload="auto"
    disablepictureinpicture
  >
    <source src="./loop.mp4" type="video/mp4">
  </video>

  <script>
    const video = document.getElementById("animation");

    video.muted = true;
    video.defaultMuted = true;
    video.loop = true;

    function startVideo() {
      const promise = video.play();

      if (promise !== undefined) {
        promise.catch(() => {
          console.log("Autoplay blockiert");
        });
      }
    }

    video.addEventListener("loadeddata", startVideo);
    video.addEventListener("canplay", startVideo);

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) startVideo();
    });

    window.addEventListener("pageshow", startVideo);

    startVideo();
  </script>

</body>
</html>
